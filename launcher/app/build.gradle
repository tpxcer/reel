plugins {
    id 'com.android.application'
}

// Reel TV's published releases: -PreelSigning=<keystore.properties> (storeFile, storePassword, keyAlias, keyPassword),
// kept outside the repo. Without it the release build keeps the debug key, as before.
def reelSigning = providers.gradleProperty('reelSigning').orNull

android {
    namespace 'io.github.tpxcer.reel'
    compileSdk 34

    defaultConfig {
        // -PlauncherApplicationId=<id> builds under another package id, e.g. to keep updating an install made under it.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('io.github.tpxcer.reel')
        minSdk 26
        targetSdk 34
        // Reel TV 0.2.0; the code stays above upstream's 7 so builds installed under another id still update.
        versionCode 10
        versionName '0.2.0'
    }

    signingConfigs {
        if (reelSigning) {
            reel {
                def props = new Properties()
                file(reelSigning).withInputStream { props.load(it) }
                storeFile file(props.getProperty('storeFile'))
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias')
                keyPassword props.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB: the debug key, so it installs over a debug build; Reel TV's releases use reelSigning.
            signingConfig reelSigning ? signingConfigs.reel : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
